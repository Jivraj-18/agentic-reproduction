<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reproducibility Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a sober journal-proof page. Narrow reading column for prose, full-width bands for tables. */
:root {
  --paper: #f7f8f9;
  --sheet: #ffffff;
  --ink: #1b2329;
  --ink-2: #4a5761;
  --ink-3: #74828c;
  --rule: #d9dfe3;
  --rule-2: #eceff1;
  --accent: #1d5a73;
  --accent-soft: #e3eef3;
  --gap: #a35d00;
  --gap-soft: #fdf3e2;
  --g-a: #cfe9d4; --g-a-ink: #154d24;
  --g-b: #e6f3d6; --g-b-ink: #3a5a12;
  --g-c: #fbe7b5; --g-c-ink: #6b4a00;
  --g-d: #f9cfa6; --g-d-ink: #7a3700;
  --g-e: #f4b9b5; --g-e-ink: #7d1610;
  --g-f: #e2e5e8; --g-f-ink: #4a5761;
  --ok: #1e6b35; --bad: #a3231b;
  --serif: "Iowan Old Style", "Charter", "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12171b; --sheet: #192026; --ink: #e4e9ec; --ink-2: #b2bec6; --ink-3: #8996a0;
    --rule: #2f3a42; --rule-2: #232c33; --accent: #7cc0d8; --accent-soft: #1d323c;
    --gap: #f0b45c; --gap-soft: #33280f;
    --g-a: #1e4a2a; --g-a-ink: #bfe8c9; --g-b: #2e4319; --g-b-ink: #d5ebb6;
    --g-c: #4d3d10; --g-c-ink: #f7dd9a; --g-d: #573113; --g-d-ink: #f8c899;
    --g-e: #5a1f1b; --g-e-ink: #f6bcb7; --g-f: #2c343a; --g-f-ink: #b2bec6;
    --ok: #7fd396; --bad: #f2928a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12171b; --sheet: #192026; --ink: #e4e9ec; --ink-2: #b2bec6; --ink-3: #8996a0;
  --rule: #2f3a42; --rule-2: #232c33; --accent: #7cc0d8; --accent-soft: #1d323c;
  --gap: #f0b45c; --gap-soft: #33280f;
  --g-a: #1e4a2a; --g-a-ink: #bfe8c9; --g-b: #2e4319; --g-b-ink: #d5ebb6;
  --g-c: #4d3d10; --g-c-ink: #f7dd9a; --g-d: #573113; --g-d-ink: #f8c899;
  --g-e: #5a1f1b; --g-e-ink: #f6bcb7; --g-f: #2c343a; --g-f-ink: #b2bec6;
  --ok: #7fd396; --bad: #f2928a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { background: var(--sheet); border-bottom: 1px solid var(--rule); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding-block: 10px; }
.brand { font: 600 15px/1.2 var(--serif); letter-spacing: .01em; }
.brand span { color: var(--ink-3); font: 400 13px var(--sans); margin-left: 8px; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
nav.tabs button { font: 500 14px var(--sans); color: var(--ink-2); background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
nav.tabs button:hover { background: var(--rule-2); }
nav.tabs button[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); border-color: var(--rule); }
main { padding-block: 28px 64px; }
section.band { margin-top: 40px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(22px, 2.6vw, 30px); line-height: 1.2; }
h2 { font-size: 21px; line-height: 1.3; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h2 .sub { font: 400 14px var(--sans); color: var(--ink-3); }
h3 { font-size: 17px; }
.eyebrow { font: 600 12px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.prose { max-width: 70ch; }
.prose p { margin: .6em 0; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 20px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.grid2 > *, .grid3 > * { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
/* grade chips */
.g { border-radius: 4px; padding: 1px 4px; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gA { background: var(--g-a); color: var(--g-a-ink); } .gB { background: var(--g-b); color: var(--g-b-ink); }
.gC { background: var(--g-c); color: var(--g-c-ink); } .gD { background: var(--g-d); color: var(--g-d-ink); }
.gE { background: var(--g-e); color: var(--g-e-ink); } .gF { background: var(--g-f); color: var(--g-f-ink); }
.gN { color: var(--ink-3); }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--sans); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--rule); white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); }
.pill.gap { color: var(--gap); background: var(--gap-soft); border-color: transparent; }
.pill.cat { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
/* headline */
.paper-head > *, .stack > *, .sheet, .prose { min-width: 0; }
.paper-head { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 900px) { .paper-head { grid-template-columns: 1fr; } }
.meta-dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 14px 0 0; font-size: 14px; }
.meta-dl dt { color: var(--ink-3); } .meta-dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.score-big { font: 600 28px/1.15 var(--serif); letter-spacing: .01em; }
.score-big .sep { color: var(--ink-3); font-weight: 400; margin: 0 .2em; }
.bar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; margin: 12px 0; border: 1px solid var(--rule); }
.bar span { display: block; height: 100%; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; font-size: 14px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; text-align: right; min-width: 0; overflow-wrap: anywhere; font-family: var(--mono); font-variant-numeric: tabular-nums; }
/* isolation */
.iso-list { margin: 8px 0 0; padding-left: 18px; } .iso-list li { margin: 3px 0; }
.audit { display: flex; flex-direction: column; gap: 8px; }
.audit .head { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.audit .fig { font: 600 22px var(--serif); }
/* methods */
.mitem { display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 14px 0; border-top: 1px solid var(--rule-2); }
.mitem:first-child { border-top: 0; }
@media (max-width: 820px) { .mitem { grid-template-columns: 1fr; gap: 6px; } }
.mid { font: 600 13px var(--mono); color: var(--ink-2); }
.mid small { display: block; font: 400 11px var(--sans); color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
blockquote.src { margin: 0; padding: 0 0 0 12px; border-left: 2px solid var(--rule); font: italic 14px/1.5 var(--serif); color: var(--ink-2); }
.mitem.isgap blockquote.src { border-left-color: var(--gap); }
.gapnote { margin-top: 8px; padding: 8px 10px; background: var(--gap-soft); border-radius: 6px; font-size: 13.5px; }
.gapnote b { color: var(--gap); }
details.assume { margin-top: 12px; }
details.assume summary { cursor: pointer; font-weight: 600; color: var(--accent); }
details.assume pre { white-space: pre-wrap; font: 12.5px/1.5 var(--mono); background: var(--rule-2); padding: 12px; border-radius: 6px; max-height: 380px; overflow: auto; }
/* scorecard */
.sc-controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; margin: 12px 0; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { font: 500 13px var(--sans); border: 0; background: var(--sheet); color: var(--ink-2); padding: 6px 12px; cursor: pointer; border-left: 1px solid var(--rule); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--sheet); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; color: var(--ink-2); }
.legend span.g { margin-right: 4px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.pair.wide { grid-template-columns: 1fr; }
@media (max-width: 1000px) { .pair { grid-template-columns: 1fr; } }
.tscroll { overflow-x: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.tlabel { font: 600 12px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin-bottom: 6px; }
table.pt { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.pt th, table.pt td { padding: 5px 8px; text-align: left; vertical-align: baseline; white-space: nowrap; }
table.pt thead th { font-weight: 600; border-bottom: 1px solid var(--ink-3); color: var(--ink-2); }
table.pt thead tr.grp th { border-bottom: 1px solid var(--rule); text-align: center; font-family: var(--serif); }
table.pt tbody tr { border-bottom: 1px solid var(--rule-2); }
table.pt tbody tr:last-child { border-bottom: 1px solid var(--ink-3); }
table.pt td.rl { color: var(--ink); white-space: normal; min-width: 150px; }
table.pt td.v { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.cellnum { cursor: help; }
.cellnum sup { font-size: 9px; margin-left: 1px; }
.tip { position: fixed; z-index: 20; max-width: 340px; background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.18); padding: 10px 12px; font-size: 13px; pointer-events: none; }
.tip h4 { margin: 0 0 6px; font: 600 13px var(--sans); }
.tip table { border-collapse: collapse; width: 100%; }
.tip td { padding: 2px 6px 2px 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tip td:first-child { font-family: var(--sans); color: var(--ink-3); }
/* why */
.rc { border-top: 1px solid var(--rule); padding-top: 18px; margin-top: 18px; }
.rc:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
.rc-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
.wording { margin: 12px 0; padding: 12px 14px; border-radius: 6px; background: var(--accent-soft); font: 15px/1.5 var(--serif); }
.wording .eyebrow { display: block; margin-bottom: 4px; color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; margin-top: 12px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card .ch { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card .ch b { font-size: 14px; }
.card .vals { font-family: var(--mono); font-size: 14px; }
.card .lbl { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.card p { margin: 0; font-size: 13.5px; }
.card code { font: 12px/1.45 var(--mono); background: var(--rule-2); padding: 6px 8px; border-radius: 4px; display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 13px; }
/* overview */
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-top: 16px; }
@media (max-width: 820px) { .flow { grid-template-columns: 1fr 1fr; gap: 12px 0; } }
@media (max-width: 480px) { .flow { grid-template-columns: 1fr; } }
.step { padding: 14px 16px; border-left: 1px solid var(--rule); }
.step:first-child { border-left: 0; padding-left: 0; }
@media (max-width: 820px) { .step { border-left: 0; padding-left: 0; } }
.step .n { font: 600 12px var(--mono); color: var(--accent); }
.step h3 { margin: 4px 0 6px; font-size: 16px; }
.step p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.pcard { cursor: pointer; text-align: left; font: inherit; color: inherit; }
.pcard:hover { border-color: var(--accent); }
ul.caveats { padding-left: 18px; margin: 8px 0 0; } ul.caveats li { margin: 4px 0; }
footer { color: var(--ink-3); font-size: 12.5px; padding-block: 24px 40px; border-top: 1px solid var(--rule); }
@media (prefers-reduced-motion: no-preference) { .tabpanel { animation: fade .18s ease-out; } @keyframes fade { from { opacity: .4; } to { opacity: 1; } } }

/* ---- plain-English layout: answer first, detail on demand ---- */
.hero h1 { font-size: clamp(26px, 3.4vw, 38px); line-height: 1.15; max-width: 22ch; }
.hero p.lead { font: 400 18px/1.55 var(--serif); max-width: 62ch; color: var(--ink-2); margin: 14px 0 0; }
.answer { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 24px; margin-top: 22px; }
.answer .verdict { font: 600 clamp(21px, 2.4vw, 27px)/1.3 var(--serif); max-width: 40ch; text-wrap: balance; margin: 6px 0 0; }
.answer .verdict-note { margin: 10px 0 0; color: var(--ink-2); max-width: 64ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 20px; }
.tile { text-align: left; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.tile .pct { font: 600 38px/1.05 var(--serif); font-variant-numeric: tabular-nums; }
.tile .pct small { font-size: 20px; }
.tile .lab { font-weight: 600; }
.tile .sub { font-size: 13px; color: var(--ink-2); }
.tile .cnt { font: 500 13px var(--mono); color: var(--ink-3); margin-top: 6px; font-variant-numeric: tabular-nums; }
.tile .go { font-size: 12.5px; color: var(--accent); margin-top: 6px; }
.drill { margin-top: 16px; border-top: 1px solid var(--rule); padding-top: 16px; }
.drill h3 { font-size: 18px; }
.drill .hint { color: var(--ink-3); font-size: 13.5px; margin: 4px 0 10px; }
.grp-h { font: 600 12px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 16px 0 8px; }
.items { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 8px 16px; align-items: baseline; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; }
@media (max-width: 760px) { .item { grid-template-columns: 1fr; } }
.item .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.item .vs { font: 14px var(--mono); font-variant-numeric: tabular-nums; }
.item .why { font-size: 13px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 2px; font-family: var(--sans); }
.item .sev { font: 600 12px var(--sans); }
.sev.off { color: var(--bad); } .sev.near { color: var(--gap); }
details.matches { margin-top: 14px; }
details.matches summary, details.more summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px 20px; margin-top: 10px; font-size: 13.5px; }
.mgrid div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--rule-2); padding: 3px 0; min-width: 0; }
.mgrid .v { font-family: var(--mono); color: var(--ink-2); white-space: nowrap; }
.cause { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 20px; }
.cause + .cause { margin-top: 14px; }
.cause .tops { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
.cause dl { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 8px 16px; margin: 14px 0 0; }
@media (max-width: 640px) { .cause dl { grid-template-columns: 1fr; gap: 2px; } .cause dt { margin-top: 8px; } }
.cause dt { font-weight: 600; color: var(--ink-2); } .cause dd { margin: 0; min-width: 0; }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.callout { background: var(--accent-soft); border-radius: 10px; padding: 20px 22px; }
.callout p { margin: 6px 0 0; font: 18px/1.5 var(--serif); max-width: 62ch; }
.money { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; margin-top: 8px; }
.money .big { font: 600 30px/1 var(--serif); font-variant-numeric: tabular-nums; }
.money .cap { color: var(--ink-2); font-size: 14px; max-width: 34ch; }
details.more { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 18px; }
details.more + details.more { margin-top: 10px; }
details.more[open] summary { margin-bottom: 12px; }
details.more summary { font-size: 16px; }
.glossary { margin: 10px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); }
.minibars { display: grid; gap: 6px; margin: 12px 0 0; }
.mb { display: grid; grid-template-columns: 9rem minmax(0, 1fr) 3.2rem; gap: 10px; align-items: center; font-size: 13.5px; }
.mb .track { height: 10px; background: var(--rule-2); border-radius: 5px; overflow: hidden; }
.mb .fill { height: 100%; background: var(--accent); }
.mb .p { font: 600 13px var(--mono); text-align: right; }
.link { color: var(--accent); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
</style>
</head>

<header class="top"><div class="wrap">
  <div class="brand">Reproducibility check<span>two Wiley papers</span></div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-method" aria-controls="panel-method" aria-selected="true">Overview</button>
    <button role="tab" id="tab-A" aria-controls="panel-A" aria-selected="false">Paper A · Neurology</button>
    <button role="tab" id="tab-B" aria-controls="panel-B" aria-selected="false">Paper B · Pharmacology</button>
  </nav>
</div></header>

<main class="wrap">
  <div class="tabpanel" id="panel-method" role="tabpanel" aria-labelledby="tab-method"></div>
  <div class="tabpanel" id="panel-A" role="tabpanel" aria-labelledby="tab-A" hidden></div>
  <div class="tabpanel" id="panel-B" role="tabpanel" aria-labelledby="tab-B" hidden></div>
</main>
<footer><div class="wrap">These are saved results from one run. Nothing on this page is calculated live. The marking is done by a fixed script, not by an AI. The explanations of why numbers differed are AI judgements, each tested by re-running a different reading of the Methods.</div></footer>

 "text": "Dryad dataset doi:10.5061/dryad.f3r6799: Anonymised per-participant MRI measurements, physical function tests and clinical characteristics at baseline and 6-year follow-up.", "source": "The anonymized MRI measurements, physical function tests and clinical characteristics will be made available via the Dryad data repository", "gap": false, "gap_note": null, "v2_change": null}, {"section": "Data preparation", "id": "M1", "text": "Timed functional tests performed: 6-minute walk test, 10-m walk or run, timed up and go, stair ascend, stair descend, chair rise.", "source": "Participants underwent a series of functional assessments, including: 6-min walk test (6MWT),…10-m walk or run,…timed up and go,…stair ascend, stair descend and chair rise.", "gap": false, "gap_note": null, "v2_change": null}, {"section": "Data preparation", "id": "M2", "text": "Myometry (hand-held, dominant side) for knee flexion, knee extension, hip abduction, hip adduction and ankle dorsiflexion, in kg.", "source": "Myometry was performed on the dominant side using a hand-held myometer (Citec or Microfet) assessing: knee flexion, knee extension, hip abduction, hip adduction, and ankle dorsiflexion.", "gap": true, "gap_note": "Hip flexion is reported in Table 1 but is not among the myometry movements listed in the Methods.", "v2_change": null}, {"section": "Data preparation", "id": "M3", "text": "Forced vital capacity expressed as % of predicted value for height.", "source": "Forced vital capacity (FVC) was measured and expressed as a percentage of predicted value for height.", "gap": true, "gap_note": "Methods do not mention that FVC was measured both sitting and lying; Table 1 reports both positions.", "v2_change": null}, {"section": "Data preparation", "id": "M4", "text": "Timed tests are expressed as velocities so that participants unable to perform can be included: 10-m walk/run = metres / time; stairs = 4 stairs / time; timed up and go = 6 m / time.", "source": "To incorporate participants unable to perform assessments, results were expressed as a velocity (msec-1 or stairs/sec). For the 10-m walk or run, the number of meters was divided by the time taken, the number of stairs (four) was divided by stair ascend and descend times, and the 6 m were divided by timed up and go test time.", "gap": true, "gap_note": "The velocity assigned to a participant who cannot perform a test is not stated (zero is implied but not written).", "v2_change": null}, {"section": "Data preparation", "id": "M5", "text": "Chair rise is analysed as a time in seconds; participants unable to perform it are given 10,000 s so they rank last in the Wilcoxon test.", "source": "For nonparametric testing of the chair rise time, where a participant was unable to perform a timed functional assessment, a value greater than the longest possible result (10,000s) was used to provide correct ranking.", "gap": true, "gap_note": "Says the 10,000 s value is used 'for nonparametric testing'. It does not say whether the same value is used when computing the chair-rise medians.", "v2_change": null}, {"section": "Data preparation", "id": "M6", "text": "Missing data / analysis set: each Table 1 row reports how many participants had paired (baseline and follow-up) values for some rows.", "source": "Paired values available in 17 participants.", "gap": true, "gap_note": "No missing-data rule is stated. Footnotes give paired counts for some rows (FVC sitting and chair rise: 17; FVC lying: 16; timed up and go, 10-m walk/run, stair ascent and descent: 22), but it is not said whether the medians use only participants with paired values or every available value at each visit. Rows without a footnote are presumably complete.", "v2_change": null}, {"section": "Table filter", "id": "F1", "text": "Row footnotes on paired data: FVC sitting and chair rise -> 17 participants with paired values; FVC lying -> 16; timed up and go, 10-m walk/run, stair ascent, stair descent -> 22.", "source": "Paired values available in 22 participants.", "gap": false, "gap_note": null, "v2_change": null}, {"section": "Table filter", "id": "F2", "text": "Chair rise: participants unable to perform were given 10,000 s for the Wilcoxon test.", "source": "Participants unable to perform the chair rise were given a value of 10,000 (effectively infinity) for the purposes of the Wilcoxon nonparametric rank signed test.", "gap": false, "gap_note": null, "v2_change": null}, {"section": "Table specification", "id": "S1", "text": "Descriptive statistics: median (and range) at baseline and at 6 years.", "source": "Statistical analysis was performed using SPSS v24, with data presented as median and range unless otherwise indicated.", "gap": false, "gap_note": null, "v2_change": null}, {"section": "Table specification", "id": "S2", "text": "P value: Wilcoxon signed-rank test comparing baseline and 6-year values.", "source": "Statistical significance was calculated using the Wilcoxon test for nonparametric data.", "gap": true, "gap_note": "The Wilcoxon variant is not stated: exact or normal approximation, continuity correction, and handling of zero differences and ties. SPSS defaults to the asymptotic test.", "v2_change": null}, {"section": "Table specification", "id": "S3", "text": "Significance threshold; significant P values carry the marker 'a'.", "source": "Statistical significance was taken to be P < 0.05.", "gap": false, "gap_note": null, "v2_change": null}, {"section": "Table specification", "id": "S4", "text": "SRM = mean of paired differences over 6 years divided by the standard deviation of those differences.", "source": "Standardized response means (SRM) were calculated for all outcome measures by taking the average of the paired difference over the 6 years divided by the standard deviation of these differences.", "gap": true, "gap_note": "The direction of the difference (follow-up minus baseline, or the reverse) and the SD denominator (n-1 or n) are not stated.", "v2_change": null}], "source_c blems.", "source": "In the whole of the study, 3 technical replicate datapoints from a single experiment were excluded because the experimenter noted technical issues in the execution of that experiment.", "gap": true, "gap_note": "Which experiment, assay and condition was excluded is not stated.", "v2_change": null}, {"section": "Data preparation", "id": "M4", "text": "Normalisation: each concentration-response curve's raw data are divided by K, the mean Emin of that curve on that plate (so the curve's minimum response is 1, 'fold').", "source": "For all concentration-response curves (CRC; Figures 2B,D, 3B,D, 4B,D, and 5B,D), raw data were transformed in GraphPad Prism using the formula \"Y=Y/K\" where 'K' represented the mean Emin observed for the CRC obtained from raw data in a single 96-well plate for that treatment group.", "gap": true, "gap_note": "'Emin' is not defined operationally (which concentration(s) count as the minimum response, and for an inhibition curve whether it is the lowest or the unstimulated end).", "v2_change": null}, {"section": "Table filter", "id": "F1", "text": "Cells: CHO-K1 cells stably expressing CB1, transiently transfected with OX1 (0.00, 0.10, 0.25, 0.50 µg); agonist CP55,940.", "source": "CHO cells stably expressing CB1 and transiently expressing OX1 were treated with 10µM FSK and 0.1nM—10µM CP55,940 for 90min to measure cAMP inhibition (A, B) or 0.1nM—10µM CP55,940 for 90min to measure βarrestin2 recruitment (C, D).", "gap": false, "gap_note": null, "v2_change": null}, {"section": "Table filter", "id": "F2", "text": "Table 1 footnote 'a' marks the 0.50 µg OX1 row of the cAMP columns (pEC50, Emax, Hill slope): only that curve is reported from a fit with the Hill slope constrained. The other curves are reported from the 4-parameter fit.", "source": "In addition, transfection with 0.50µg OX1 resulted in a CRC that could not be fit to a 4-parameter model (Table 1).", "gap": false, "gap_note": null, "v2_change": "Added in v2. v1 gave ned for an inhibition curve (lower plateau, upper plateau, or span). The column header 'pEC50 (nM)' mixes a unitless log value with a nM unit.", "v2_change": null}, {"section": "Table specification", "id": "S4", "text": "Uncertainty: values given as mean ± SEM.", "source": "All values are expressed as the mean±the standard error of the mean (SEM) or 95% confidence interval (CI), as indicated.", "gap": true, "gap_note": "For fitted parameters it is not stated whether the ± is the SEM across independent experiments or the standard error of the curve-fit parameter.", "v2_change": null}, {"section": "Table specification", "id": "S5", "text": "Rule when potency cannot be estimated: report Emax as the mean of the greatest observed response and EC50 as a bound.", "source": "If potency could not be estimated (i.e., …), then Emax is reported as the mean of the greatest response observed.", "gap": true, "gap_note": "The same convention is stated in the note to Table 2 and, for Table 1, in its footnote b (item F3). The criterion for 'could not be estimated' is not operationalised.", "v2_change": "v1's gap note wrongly said the rule is absent from Table 1."}, {"section": "Table specification", "id": "S6", "text": "Rule when a 4-parameter fit cannot estimate pEC50 and Hill slope: refit with Hill slope constrained to 1 and report that fit. In Table 1 this applies to the 0.50 µg cAMP curve (item F2).", "source": "When fit to a 4-parameter model, pEC50 and Hill Slope could not be accurately estimated, data in table are for a Hill Slope constrained to 1.", "gap": true, "gap_note": "'Could not be accurately estimated' is not defined. 'Constrained to 1' is ambiguous in sign for a downward (inhibition) curve.", "v2_change": "v2 links the rule to the row it marks."}, {"section": "Table specification", "id": "S7", "text": "Significance markers: one-way ANOVA with Tukey's post hoc test, comparing transfection groups to the group without OX1.", "source": "Statistical analyses were by one-way ANOVA followed by Tukey's post hoc test.", "gap": true, "gap_note": "Not stated which values enter the ANOVA (per-experiment fitted parameters, or summary mean ± SEM and n). The table legend says the comparison is 'relative to CP55,940', which does not name a reference group.", "v2_change": null}], "source_check": {"n": 18, "n_failed": 0, "results": [{"item": "RQ", "path": "research_question", "verbatim": true}, {"item": "SET", "path": "setting", "verbatim": true}, {"item": "D1", "path": "data_sources[0]", "verbatim": true}, {"item": "M1", "path": "general_manipulations[0]", "verbatim": true}, {"item": "M2", "path": "general_manipulations[1]", "verbatim": true}, {"item": "M2b", "path": "general_manipulations[2]", "verbatim": true}, {"item": "M3", "path": "general_manipulations[3]", "verbatim": true}, {"item": "M4", "path": "general_manipulations[4]", "verbatim": true}, {"item": "F1", "path": "tables[0].table_specific_filters[0]", "verbatim": true}, {"item": "F2", "path": "tables[0].table_specific_filters[1]", "verbatim": true}, {"item": "F3", "path": "tables[0].table_specific_filters[2]", "verbatim": true}, {"item": "S1", "path": "tables[0].specification[0]", "verbatim": true}, {"item": "S2", "path": "tables[0].specification[1]", "verbatim": true}, {"item": "S3", "path": "tables[0].specification[2]", "verbatim": true}, {"item": "S4", "path": "tables[0].specification[3]", "verbatim": true}, {"item": "S5", "path": "tables[0].specification[4]", "verbatim": true}, {"item": "S6", "path": "tables[0].specification[5]", "verbatim": true}, {"item": "S7", "path": "tables[0].specification[6]", "verbatim": true}]}, "manifest": {"paper": "B", "files": [{"name": "crc_cAMP_fold.csv", "role": "tab 'cAMP Fig 2B 3B 4B 5B': cAMP fold data per experiment, by log[CP55,940]", "given_to_reproducer": true}, {"name": "crc_barr2_fold.csv", "role": "tab 'barr2 Fig 2D 3D 4D 5D': βarrestin2 fold data per experiment, by log[CP55,940]", "given_to_reproducer": true}], "required_inputs": [{"inpu  "answers": 0, "data": 2}, "r3": {"inputs": 0, "answers": 0, "data": 2}}}, "assumptions": {"r1": "# Assumptions (Table 1, CB1-OX1, CP55,940)\n\n- **Data blocks (F1)**: I used the \"CB1R - OX1R\" block of `crc_cAMP_fold.csv` and the \"CB1R-OX1R\" block of `crc_barr2_fold.csv`. Each non-empty column is one independent experiment (already the mean of its technical triplicate); x = log10[CP55,940] (M), -10 to -5. I ignored the CB1-OX2 and CB2 blocks (and the CB2 header labels that look swapped).\n- **M2b (n = 4-8)**: I used every non-empty column. The 0.00 µg (mock) groups have 8 columns in both assays and the OX1 groups have 4, so I read n = 8 for the controls and n = 4 for the transfected groups. In the barr2 0.00 µg group, experiments 5-8 reach about 30-fold while experiments 1-4 reach about 4-5-fold. I kept all 8 anyway. Rejected: dropping columns 5-8, because nothing in the methods says to.\n- **M3 (exclusion)**: No cells are blank inside the CB1-OX1 blocks, and the deposit is already per-experiment fold data. I assumed the excluded triplicate was removed before export, so I excluded nothing more. Rejected: guessing an outlier experiment to drop.\n- **M4 (normalisation, Emin)**: The deposited values are already \"fold\" (Y/K). I used them as they are and did not normalise again. Rejected: renormalising each column to its -10 M value, because that would apply K twice.\n- **S2 (fit strategy)**: I fit one curve per condition to all points pooled across experiments (Prism's default for replicate Y columns), by unweighted least squares with the Prism 4PL equation `Y = Bottom + (Top-Bottom)/(1+10^((LogEC50-X)*Hill))`. I constrained the Hill sign to the direction of the response: negative for cAMP inhibition, positive for barr2 recruitment. Rejected: fitting each experiment and averaging. That version is printed in run.log as a sensitivity check; the per-experiment cAMP fits are unstable (one 0.00 µg experiment gives pEC50 > 20).\n- **S2/S6/F2 (when to constrain)**: Footnote a decides this, so only the 0.50 µg cAMP curve uses the Hill = 1 fit. That curve's unconstrained fit is degenerate (SE of LogEC50 is about 2000). The script logs an objective \"failed\" flag (logEC50 outside the tested range, SE(logEC50) > 1, or SE(Hill) > |Hill|). The flag also fires for the cAMP 0.00 µg curve (Hill -1.70 ± 3.59), but I kept that curve at 4PL as F2 says. Rejected: letting the flag override the footnote.\n- **S6 (sign of \"constrained to 1\")**: I used Prism's \"log(agonist) vs. response\" equation with Hill = +1. For a downward curve this fits Top < Bottom, so I report the Hill slope as 1.0, with \"N/A\" for its ± because a fixed parameter has no SE. Rejected: reporting -1 (the same curve with the sign flipped).\n- **S3 (Emax for cAMP)**: Emax is the fitted lower plateau, i.e. the fold of forskolin cAMP left at maximal inhibition (for example 0.79 for mock). For barr2, Emax is the fitted upper plateau. Rejected: the span (Top - Bottom).\n- **S3 (units)**: pEC50 is -log10 EC50 (M) and has no unit. EC50 is given in nM as 10^(-pEC50) x 1e9.\n- **S4 (±)**: The ± is the asymptotic standard error of the pooled-fit parameter (Prism's \"Std. Error\"). Rejected: SEM across per-experiment fits (see the sensitivity block in run.log).\n- **F3/S5 (barr2 0.00 µg)**: The observed Emax is the mean ± SEM across the 8 experiments at the highest concentration (10 µM): 16.54 ± 4.62. The EC50 is given as a bound because the curve has no asymptote inside the tested range: pEC50 \"<5\", EC50 \">10000\" nM. The pEC50 ± is \"N/A\". For the Hill slope I report the pooled 4PL estimate, since the methods give no special rule for it. Rejected: the maximum single response, and reporting the unstable fitted pEC50 (5.60 ± 1.37).\n- **S7 (stars)**: One-way ANOVA then Tukey's test, run from summary statistics. Each group enters as its table value, ± SE taken as the SEM, and n = number of experiments, as Prism does for a \"Mean, SEM, N\" table. Only comparisons against 0.00 µg get stars (* p<0.05, ** p<0.01, *** p<0.001). A parameter gets no stars when the reference value is a bound (barr2 pEC50). A row whose value is constrained, with no SE, is left out of that ANOVA (cAMP Hill at 0.50 µg). Rejected: ANOVA on per-experiment fitted parameters, which run.log reports: it gives no significant cAMP Emax differences.\n- **Template column \"camp_ec50\"/\"arr_ec50\"**: This is the EC50 in nM shown in parentheses in the table, computed from pEC50.\n", "r2": "# Assumptions (Table 1, CB1-OX1, CP55,940)\n\n- **Data blocks (F1)**: I used the `CB1R - OX1R` block of `crc_cAMP_fold.csv` and the `CB1R-OX1R` block of `crc_barr2_fold.csv`. Each column is one independent experiment, and each value is already a per-experiment mean of the technical triplicate.\n- **M2b (n = 4 to 8)**: the 0.00 µg (mock) group uses all 8 columns listed under the \"0.00 µg OX1R\" header in the deposit, giving n = 8. All other groups have n = 4. Why: the deposit lists these 8 columns under the OX1 header, and this is the only group with 8 columns. The same 8 columns also appear under the OX2 header. Columns 5 to 8 look like mock controls from the OX2 series: in βarrestin2 they reach about 28-fold, against about 4-fold in columns 1 to 4. The alternative I rejected was to use only columns 1 to 4 as the OX1-series mock. With those 4 columns the βarrestin2 0.00 curve fits a clear plateau (Top about 5.1, pEC50 about 6.18). That conflicts with footnote F3, which says this curve did not reach an asymptote.\n- **M3 (exclusion)**: no exclusion was applied. The deposit holds only per-experiment means, so the 3 excluded technical replicates cannot be identified or removed. I assume the deposited means already reflect the exclusion.\n- **M4 (normalisation / Emin)**: no renormalisation. The data are already in fold (values at 0.1 nM are about 1) and are used as deposited.\n- **S2 (fit strategy)**: I fit one curve per condition by unweighted least squares to all per-experiment points pooled (n_exp × 6 points), which is Prism's default for replicate Y columns. I used the Prism variable-slope model and multistart to reach the global minimum. Why: the paper flags only the 0.50 µg cAMP curve as failing the 4-parameter fit, and that is exactly what a pooled fit shows (Hill about -13.5, SEs infinite). Per-experiment fits fail for several curves in different groups. Rejected alternative: fit each experiment separately and average the parameters.\n- **S6 / F2 (constrained slope)**: the 4-parameter fit counts as \"not accurately estimated\" when the parameter SEs are non-finite or the Hill slope is extreme. This happens only for 0.50 µg cAMP, the row the paper marks. That curve is refit with |Hill| = 1. Because the curve falls, the Hill slope is reported in Prism's sign convention as **-1** (the rejected alternative is +1). Its SE is \"N/A\", and that Hill value is left out of the ANOVA.\n- **Hill sign**: all cAMP Hill slopes are reported in Prism convention (Bottom < Top), so they are negative for the falling cAMP curves. Rejected alternative: report absolute values.\n- **S3 (Emax for cAMP)**: Emax is the fitted Bottom plateau, i.e. the fold of forskolin cAMP left at maximal inhibition. Rejected alternatives: span (Top - Bottom) and % inhibition. For βarrestin2, Emax is the fitted Top.\n- **S5 / F3 (βarrestin2 0.00 µg)**: Emax is the observed value, taken as the mean ± SEM (n = 8) of the responses at the highest concentration (10 µM). For the EC50 bound, I interpolated (linearly in log concentration) the concentration where the mean curve reaches half its observed maximum. Since the true maximum is at least the observed one, the EC50 is at least this value. Result: pEC50 \"<5.744\" and EC50 \">1.80e3 nM\". The Hill slope for this row is still the pooled 4-parameter fit value, because the footnote only replaces Emax and EC50. Rejected alternative for the bound: \">10 µM\" (the top concentration).\n- **S4 (±)**: ± is the asymptotic standard error of the pooled-fit parameter, as Prism reports it. For the observed βarrestin2 0.00 Emax, ± is the SEM across experiments. Rejected alternative: SEM of per-experiment fitted parameters.\n- **S7 (stars)**: one-way ANOVA with Tukey-Kramer, run from summary statistics as Prism allows from mean, SEM and n. The inputs are the fitted value, SD = SE × sqrt(n_exp), and n = number of experiments. Each OX1 group is compared with the 0.00 µg group. Thresholds are * < 0.05, ** < 0.01, *** < 0.001, and \"\" means not significant. I mark \"N/A\" where no test was possible: the ± and EC50 cells, the fixed Hill slope, and βarrestin2 pEC50 (the reference group is only a bound, so there is nothing to compare against).\n- **EC50 column**: EC50 (nM) = 10^(-pEC50) × 1e9.\n", "r3": "# Assumptions (Table 1, CB1-OX1)\n\n- **Data block (F1)**: used the `CB1R - OX1R` block of `crc_cAMP_fold.csv` and the `CB1R-OX1R` block of `crc_barr2_fold.csv`. Each non-empty column under a condition header is treated as one independent experiment (value = that experiment's mean of its technical triplicate).\n- **M2b (n=4-8)**: the deposited workbook lists 8 experiment columns under \"0.00 µg OX1R\" and 4 under each OX1 amount. I used all 8 for the 0.00 µg control, because the deposit groups them under that header and the paper says n=4-8. Rejected: using only the first 4 columns (they look like the OX1 series, and columns 5-8 look like the OX2 series' control). That alternative changes the 0.00 row a lot (βarr2 observed Emax about 4.37 instead of 16.54; cAMP pEC50 8.99 instead of 8.83). `run.log` prints it as a sensitivity check.\n- **M3 (exclusion)**: there are no blank cells in the CB1-OX1 blocks, so I excluded nothing. I assumed any excluded replicates were already removed before the per-experiment values were deposited. Rejected: guessing which experiment to drop.\n- **M4 (normalisation)**: the data are already expressed as fold, so I did not renormalise. Rejected: dividing again by the lowest-concentration mean, which would double-normalise.\n- **S2 (fit strategy)**: fitted one variable-slope 4-parameter log(agonist)-response curve per condition, by least squares, to all per-experiment points pooled. This is how Prism fits a grouped table with replicates. I tried several starting values for logEC50 and kept the fit with the lowest RSS. Rejected: fitting each experiment separately and averaging, because the paper talks about \"the CRC\" for a condition failing to fit or not reaching an asymptote, which implies one curve per condition. Six points per experiment also make per-experiment 4PL fits unstable.\n- **S2/S6 (when the 4PL fails)**: I followed F2 and constrained the Hill slope only for the cAMP 0.50 µg curve. The data back this up: that unconstrained fit gives Hill = -12 and a singular covariance (infinite SEs), while all other curves give finite SEs.\n- **S6 (sign of the constrained slope)**: for the downward cAMP curve I fitted nH = -1, which is the same as Prism's 3-parameter model with slope 1 and Top below Bottom. I report the Hill value as 1.0, the \"constrained to 1\" in the text, with ± = \"N/A\". Rejected: printing -1. The fitted curve is identical either way; only the printed sign differs.\n- **S3 (Emax)**: for cAMP inhibition, Emax = the fitted plateau at high agonist concentration (the bottom plateau, in fold below 1). For βarrestin2, Emax = the top plateau. Rejected: the span (1 - bottom).\n- **S3 (pEC50 / EC50)**: pEC50 = -logEC50 (M). EC50 in nM = 10^(-pEC50) × 1e9. The cAMP Hill slopes are reported negative (descending curve, Prism agonist model).\n- **S4 (±)**: ± is the asymptotic standard error of the best-fit parameter from the pooled fit. Rejected: SEM across per-experiment fits (see S2). The exception is the observed βarr2 0.00 µg Emax, where ± is the SEM across experiments.\n- **F3/S5 (βarr2 0.00 µg, \"observed\" Emax)**: Emax = mean ± SEM across experiments of the response at the highest concentration (10 µM). For the EC50 bound I report pEC50 \"<5.5957   return { n: s.n, p20: pc(s.close.length, s.n), pex: pc(s.exact.length, s.n), fixed_exact: s.exact.length + fixable,
           v1p20: v1 ? pc(v1[0], v1[1]) : "" };
}

/* ---------- labels ---------- */
const COLS = {
  A: { med_b: "middle value at start", med_f: "middle value at 6 years", p: "P value", srm: "size of change" },
  B: { camp_pec50: "cAMP potency", camp_pec50_se: "cAMP potency, uncertainty", camp_ec50: "cAMP dose for half the effect (nM)",
       camp_emax: "cAMP biggest effect", camp_emax_se: "cAMP biggest effect, uncertainty", camp_hill: "cAMP slope", camp_hill_se: "cAMP slope, uncertainty",
       arr_pec50: "Arrestin potency", arr_pec50_se: "Arrestin potency, uncertainty", arr_ec50: "Arrestin dose for half the effect (nM)",
       arr_emax: "Arrestin biggest effect", arr_emax_se: "Arrestin biggest effect, uncertainty", arr_hill: "Arrestin slope", arr_hill_se: "Arrestin slope, uncertainty" }
};
function cellLabel(p, key) {
  const [rid, cid] = key.split("|");
  const row = p.rows.find(r => r.id === rid);
  const rl = p.pid === "B" ? (row ? row.label.replace("[OX1]", "Orexin receptor") : rid) : (row ? row.label : rid);
  return `${rl}: ${(COLS[p.pid] || {})[cid] || cid}`;
}
const pubText = c => String(c.pub ?? "").replace(/^-/, "−");

/* ---------- the numbers tab content shared by both views ---------- */
function shownValue(c, view) {
  if (!c.graded) return { text: "", grade: null };
  const r = view === "med" ? c.med : c.runs[view];
  const g = view === "med" ? c.mg : r.g;
  if (!r) return { text: "–", grade: "F" };
  let text;
  if (r.v == null) text = (r.raw == null || r.raw === "") ? "—" : roundText(String(r.raw));
  else if (typeof r.raw === "string" && /^[<>]/.test(r.raw)) text = roundText(r.raw);
  else if (/^[<>]/.test(String(c.pub)) && r.u != null &&
           (String(c.pub)[0] === "<" ? r.u < Number(String(c.pub).slice(1)) : r.u > Number(String(c.pub).slice(1))))
    text = String(c.pub);
  else {
    const dec = (String(c.pub).split(".")[1] || "").length;
    text = Number(r.v).toFixed(dec);
  }
  return { text: text.replace(/^-/, "−"), grade: g };
}

function renderTable(pid, which, view) {
  const p = DATA.papers[pid], L = p.meta.layout;
  const hasGroups = L.some(g => g.group);
  let head = "";
  if (hasGroups) head += `<tr class="grp"><th></th>${L.map(g => `<th colspan="${g.cols.length}">${esc(g.group)}</th>`).join("")}</tr>`;
  head += `<tr><th>${esc(p.meta.row_head)}</th>${L.flatMap(g => g.cols).map(c => `<th>${esc(c.label)}</th>`).join("")}</tr>`;
  const body = p.rows.map(r => {
    const tds = L.flatMap(g => g.cols).map(col => {
      let fmt = col.fmt;
      fmt = fmt.replace(/ ± \{(\w+)\}/g, (m, k) => p.cells[`${r.id}|${k}`].pub == null ? "" : m);
      fmt = fmt.replace(/ \(\{(\w+)\}\)/g, (m, k) => p.cells[`${r.id}|${k}`].pub == null ? "" : m);
      const html = esc(fmt).replace(/\{(\w+)\}/g, (m, k) => {
        const key = `${r.id}|${k}`, c = p.cells[key];
        if (which === "pub") {
          const t = pubText(c);
          const st = c.pstars && c.pstars !== "" ? `<sup>${esc(c.pstars)}</sup>` : "";
          const mk = c.mark ? `<sup>${esc(c.mark)}</sup>` : "";
          const cls = c.graded ? `g g${view === "med" ? c.mg : c.runs[view].g}` : "gN";
          return `<span class="cellnum ${cls}" tabindex="0" data-k="${key}" data-p="${pid}">${esc(t)}${st}${mk}</span>`;
        }
        const sv = shownValue(c, view);
        if (!c.graded) {
          const rr = view === "med" ? Object.values(c.runs)[0] : c.runs[view];
          const raw = rr && rr.raw != null ? (typeof rr.raw === "number" ? roundText(sig(rr.raw)) : rr.raw) : "";
          return `<span class="cellnum gN" tabindex="0" data-k="${key}" data-p="${pid}" title="Not graded: the paper prints no number here">${esc(String(raw).replace(/^-/, "−"))}</span>`;
        }
        const rs = view === "med" ? c.runs[Object.keys(c.runs)[0]].s : c.runs[view].s;
        const st = rs && rs !== "" ? `<sup>${esc(rs)}</sup>` : "";
        return `<span class="cellnum g g${sv.grade}" tabindex="0" data-k="${key}" data-p="${pid}">${esc(sv.text)}${st}</span>`;
      });
      return `<td class="v">${html}</td>`;
    }).join("");
    return `<tr><td class="rl">${esc(r.label)}</td>${tds}</tr>`;
  }).join("");
  return `<table class="pt"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function tipHTML(pid, key) {
  const p = DATA.papers[pid], c = p.cells[key];
  let rows = `<tr><td>Published</td><td>${esc(pubText(c) || "not printed")}${c.pstars ? " " + esc(c.pstars) : ""}</td><td></td></tr>`;
  for (const r of p.runs) {
    const x = c.runs[r];
    const val = x.u != null ? likePub(x.u, c.pub) : roundText(x.raw ?? "—");
    rows += `<tr><td>${RUN_LABEL[r]}</td><td>${esc(String(val))}</td><td>${c.graded ? `<span class="g g${x.g}">${x.g}</span> ${fmtDev(x.d)}` : ""}</td></tr>`;
  }
  if (c.graded) {
    rows += `<tr><td>Combined</td><td>${c.med.u != null ? esc(likePub(c.med.u, c.pub)) : esc(roundText(c.med.raw ?? "—"))}</td><td><span class="g g${c.mg}">${c.mg}</span> ${fmtDev(c.med.d)}</td></tr>`;
    rows += `<tr><td>Spread across runs</td><td colspan="2">${c.spread == null ? "–" : fmtDev(c.spread) + " of the published value"}</td></tr>`;
  } else rows += `<tr><td colspan="3">Not graded: the paper prints no number here.</td></tr>`;
  return `<h4>${esc(cellLabel(p, key))}</h4><table>${rows}</table>`;
}

  <section class="band">
    <h2>How it works</h2>

      <div class="step"><div class="n">2</div><h3>Rebuild</h3><p>An AI sees only the checklist, the blank table and the shared data. It writes code to fill the table. It does this three times, each time from scratch.</p></div>
      <div class="step"><div class="n">3</div><h3>Compare</h3><p>A fixed script compares each number with the published one. No AI is involved in the marking.</p></div>

/* ---------- paper tab ---------- */
function causeOf(p, key) {
  const c = (p.attribution.cells || []).find(x => x.cell === key);
  return c ? c.root_cause : null;
}
function itemHTML(p, key) {
  const c = p.cells[key], rc = causeOf(p, key);
  const pl = rc && PL.papers[p.pid].causes[rc];
  const wrong = c.med.sg === false;
  const far = ["C", "D", "E", "F"].includes(c.mg);
  const sev = wrong ? "points the other way" : `off by ${fmtDev(c.med.d)}`;
  return `<div class="item">
    <div class="nm">${esc(cellLabel(p, key))}</div>
    <div class="vs">Published ${esc(pubText(c))} · AI ${esc(shownValue(c, "med").text)}</div>
    <div><span class="sev ${far || wrong ? "off" : "near"}">${sev}</span>${pl ? `<br><button class="why" data-cause="${p.pid}-${rc}">${esc(pl.title)}</button>` : ""}</div>
  </div>`;
}
function drillHTML(p, tile) {
  const s = stats(p);
  const set = s[tile.id];
  const miss = s.keys.filter(k => !set.includes(k));
  const sev = k => GR.indexOf(p.cells[k].mg) * 1000 + (p.cells[k].med.d === Infinity ? 999 : (p.cells[k].med.d || 0));
  miss.sort((a, b) => sev(b) - sev(a));
  let body;
  if (!miss.length) body = `<p class="hint">None. Every one of the ${s.n} numbers ${tile.verb}.</p>`;
  else if (tile.id === "exact") {
    const far = miss.filter(k => ["C", "D", "E", "F"].includes(p.cells[k].mg)), near = miss.filter(k => p.cells[k].mg === "B");
    body = `<p class="hint">${miss.length} of ${s.n} are not an exact match. The biggest differences come first.</p>` +
      (far.length ? `<div class="grp-h">More than 20% off (${far.length})</div><div class="items">${far.map(k => itemHTML(p, k)).join("")}</div>` : "") +
      (near.length ? `<div class="grp-h">Between 2% and 20% off (${near.length})</div><div class="items">${near.map(k => itemHTML(p, k)).join("")}</div>` : "");
  } else body = `<p class="hint">${miss.length} of ${s.n} ${miss.length === 1 ? "does" : "do"} not ${tile.neg}.</p><div class="items">${miss.map(k => itemHTML(p, k)).join("")}</div>`;
  const rest = set.map(k => `<div><span>${esc(cellLabel(p, k))}</span><span class="v">${esc(pubText(p.cells[k]))}</span></div>`).join("");
  return `<h3>${esc(tile.title)}</h3>${body}
    <details class="matches"><summary>Show the ${set.length} that ${tile.verb}</summary><div class="mgrid">${rest}</div></details>`;
}

function renderPaper(pid) {
  const p = DATA.papers[pid]; p.pid = pid;
  const m = p.meta, s = stats(p), v = vars(pid), pl = PL.papers[pid], runs = p.runs;
  const tiles = [
    { id: "exact", pct: pc(s.exact.length, s.n), lab: "Almost exactly right", sub: "within 2% of the published number", n: s.exact.length, verb: "match almost exactly", neg: "match exactly", title: "Numbers that are not an exact match" },
    { id: "close", pct: pc(s.close.length, s.n), lab: "Close enough", sub: "within 20% of the published number", n: s.close.length, verb: "are within 20%", neg: "come within 20%", title: "Numbers more than 20% off" },
    { id: "sign", pct: pc(s.sign.length, s.n), lab: "Same direction", sub: "up or down, like the published number", n: s.sign.length, verb: "point the same way", neg: "point the same way", title: "Numbers pointing the other way" }
  ];

        <div class="pair ${pid === "B" ? "wide" : ""}" id="pair-${pid}"></div>
        <p class="small muted">Hover over or select any number to see the published value, all three runs and how far off each was. Grey numbers are not graded because the paper prints no number there.</p>
        ${pid === "B" ? `<ul class="glossary"><li><b>Potency (pEC50):</b> a higher number means the drug works at a lower dose.</li><li><b>Biggest effect (Emax):</b> the largest response seen.</li><li><b>Steepness (Hill slope):</b> how sharply the response rises as the dose goes up.</li><li><b>±:</b> the uncertainty the paper gives for each value.</li></ul>` : `<ul class="glossary"><li><b>Size of change (SRM):</b> the average change divided by how much it varies between people.</li><li><b>P value:</b> how likely a change this large is by chance. Marked <sup>a</sup> when below 0.05.</li></ul>`}
      </details>
      <details class="more"><summary>The Methods as the AI saw them (${p.methods.length} points, ${nGap} with something left unsaid)</summary>
        <p class="small muted prose">Each point is next to the exact sentence it came from. ${sc ? `All ${sc.n} sentences were checked word for word against the paper. ` : ""}Points with something left unsaid are marked in amber.</p>
        <div>${methods}</div>
        ${assume}
      </details>
      <details class="more"><summary>How we know the AI could not see the answers</summary>
        <div class="grid2">
          <div class="prose small">
            <h3>What it was given</h3>
            <ul class="iso-list"><li>The Methods checklist (${p.methods.length} points), without the paper's title or DOI.</li><li>An empty copy of the results table.</li>${seen}<li>Rules: stay in your folder, do not use the internet, write down every choice.</li></ul>
            <h3 style="margin-top:14px">What it was not given</h3>
            <ul class="iso-list"><li>The paper, its results and its figures.</li><li>The published numbers.</li>${withheld}</ul>
          </div>
          <div class="stack">
            <div class="sheet audit"><div class="head"><h3>Did the answers leak?</h3>${pass(p.leak.pass && leakIn === 0)}</div>
              <div class="small">We searched every file the AI saw for the ${p.leak.tokens} published numbers${p.leak.answers ? ` and for ${p.leak.answers} more from the authors' own fitting output` : ""}. Found: <b>${leakIn}</b>.${p.leak.unsearchable.length ? ` ${p.leak.unsearchable.length} published values are a single digit, so they cannot be searched.` : ""}</div></div>
            <div class="sheet audit"><div class="head"><h3>Did it look anywhere else?</h3>${pass(forb === 0)}</div>
              <div class="small">We read all ${totalCalls} commands the three runs made (${totalAcc} file paths). Opened outside its own folder: <b>${forb}</b>. Internet use: <b>${webHits}</b>.${pFlags.length ? ` The scan flagged ${pFlags.length} for a closer look. We checked each by hand:` : ""}</div>
              ${pFlags.length ? `<ul class="iso-list small">${reasons(pFlags)}</ul>` : ""}</div>
            <div class="sheet audit"><div class="head"><h3>Did it type in the answers?</h3>${pass(hcFlag === 0)}</div>
              <div class="small">We searched the code for published numbers typed in by hand, among ${lits} numbers in the three scripts. Found: <b>${hcFlag}</b>.${hFlags.length ? ` The scan flagged ${hFlags.length} for a closer look. We checked each by hand:` : ""}</div>
              ${hFlags.length ? `<ul class="iso-list small">${reasons(hFlags)}</ul>` : ""}</div>
          </div>
        </div>
      </details>
      <details class="more"><summary>How much the three runs agreed</summary>
        <div class="prose small"><ul class="iso-list">${perRun}</ul>
        <p>${same} of ${s.n} numbers got the same result in all three runs.</p>
        <p>Grading key: ${legend()}</p></div>
      </details>
    </div>
  </section>`;

  /* interactions */
  const drill = document.getElementById("drill-" + pid);
  const pick = id => {
    document.querySelectorAll(`#tiles-${pid} .tile`).forEach(b => b.setAttribute("aria-pressed", b.dataset.tile === id));
    drill.innerHTML = drillHTML(p, tiles.find(t => t.id === id));
    drill.querySelectorAll("[data-cause]").forEach(b => b.addEventListener("click", () => {
      const el = document.getElementById("cause-" + b.dataset.cause);
      if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
    }));
  };
  document.querySelectorAll(`#tiles-${pid} .tile`).forEach(b => b.addEventListener("click", () => pick(b.dataset.tile)));
  pick("exact");
  const draw = view => {
    document.getElementById(`pair-${pid}`).innerHTML =
      `<div class="tscroll"><div class="tlabel">Published</div>${renderTable(pid, "pub", view)}</div>
       <div class="tscroll"><div class="tlabel">Rebuilt by the AI · ${RUN_LABEL[view]}</div>${renderTable(pid, "rep", view)}</div>`;
  };
  draw("med");
  document.querySelectorAll(`#seg-${pid} button`).forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(`#seg-${pid} button`).forEach(x => x.setAttribute("aria-pressed", x === b));
    draw(b.dataset.view);
  }));
}

/* ---------- tooltip ---------- */
const tip = document.getElementById("tip");
function showTip(el) {
  tip.innerHTML = tipHTML(el.dataset.p, el.dataset.k);
  tip.hidden = false;
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), window.innerWidth - tw - 8);
  let y = r.bottom + 8; if (y + th > window.innerHeight - 8) y = r.top - th - 8;
  tip.style.left = x + "px"; tip.style.top = Math.max(8, y) + "px";
}
document.addEventListener("mouseover", e => { const el = e.target.closest(".cellnum"); if (el) showTip(el); });
document.addEventListener("mouseout", e => { if (e.target.closest(".cellnum")) tip.hidden = true; });
document.addEventListener("focusin", e => { const el = e.target.closest(".cellnum"); if (el) showTip(el); });
document.addEventListener("focusout", e => { if (e.target.closest(".cellnum")) tip.hidden = true; });
window.addEventListener("scroll", () => { tip.hidden = true; }, { passive: true });

/* ---------- tabs ---------- */
const tabs = ["method", "A", "B"];
function selectTab(id) {
  if (!tabs.includes(id)) id = "method";
  tabs.forEach(t => {
    document.getElementById("panel-" + t).hidden = t !== id;
    document.getElementById("tab-" + t).setAttribute("aria-selected", t === id);
  });
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  window.scrollTo(0, 0);
}
tabs.forEach(t => document.getElementById("tab-" + t).addEventListener("click", () => selectTab(t)));

renderMethod(); renderPaper("A"); renderPaper("B");
selectTab((location.hash || "").slice(1));
</script>
